services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cableincidents
      POSTGRES_PASSWORD: cableincidents
      POSTGRES_DB: cableincidents
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cableincidents"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data
    environment:
      CABLEINCIDENTS_DATA_DIR: /data
      CABLEINCIDENTS_DATABASE_URL: postgresql://cableincidents:cableincidents@db:5432/cableincidents
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5174:5174"
    environment:
      VITE_API_PROXY_TARGET: http://api:8001
    depends_on:
      - api

volumes:
  pgvector_data:
